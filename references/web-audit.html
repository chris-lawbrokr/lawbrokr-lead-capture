  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"25bcf78d-ce57-408d-876e-65c2cdd570aa\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* Lawbrokr 2.0 Design System — tokens.css\n   SHIPPED palette: the 2026 hue chart (team decision, 2026-09-17) — Brand purple, Indigo accent,\n   Red / Green / Yellow status — on the purple-tinted neutral scale, which is unchanged.\n   Token step numbers are OURS, not the chart's: #250D53 stays --primary-900 (the chart prints it\n   as Brand 800), so every chart step sits one notch below its token name from 300 down.\n   Family names are unchanged too: --violet-* now carries the chart's Indigo values and --amber-*\n   its Yellow values. The chart palette is five LIGHT fills (2026-09-18): brand purple, sky, yellow,\n   pink and a pale lavender, labelled in brand ink. Teal is gone.\n   Light theme only. Plain CSS custom properties: usable from Tailwind v4 `@theme inline`,\n   Astro, and Lit shadow DOM alike. All colours oklch(); hex equivalents in comments.\n   Semantic roles reference primitives. No dark block. */\n:root {\n  color-scheme: only light;\n\n  /* ───────── PRIMITIVES ───────── */\n  /* Primary (brand purple) — the 2026 chart's Brand column. Step 900 is Lawbrokr purple #250D53\n     exactly (the chart's Brand 800); 300–800 are the chart's 200–700, one notch up, and 950 is the\n     chart's 900. The chart's Brand 50 #BDAEDC, 100 #B2A1D1 and 950 #070043 are not shipped.\n     50 / 100 / 200 are the existing very-light purples, deliberately kept: they are the selected\n     and hover surfaces the whole UI is built on and sit outside the chart. */\n  --primary-50:  oklch(0.977 0.010 291.1); /* #F7F6FE — unchanged */\n  --primary-100: oklch(0.950 0.024 291.1); /* #EEECFE — unchanged */\n  --primary-200: oklch(0.900 0.052 291.1); /* #DDD9FF — unchanged */\n  --primary-300: oklch(0.679 0.074 303.1); /* #A18DBE */\n  --primary-400: oklch(0.616 0.078 305.2); /* #9079AB */\n  --primary-500: oklch(0.546 0.081 305.9); /* #7C6496 */\n  --primary-600: oklch(0.472 0.078 304.1); /* #65507F */\n  --primary-700: oklch(0.397 0.079 305.1); /* #513B69 */\n  --primary-800: oklch(0.319 0.091 300.9); /* #3B2559 */\n  --primary-900: oklch(0.249 0.116 291.1); /* #250D53  ← Lawbrokr Purple */\n  --primary-950: oklch(0.210 0.128 279.4); /* #140050 */\n\n  /* Neutral — tinted toward the purple hue (used by this variant). */\n  --neutral-50:  oklch(0.985 0.004 291.1); /* #FAFAFD */\n  --neutral-100: oklch(0.968 0.007 291.1); /* #F4F4F9 */\n  --neutral-200: oklch(0.928 0.012 291.1); /* #E7E6EF */\n  --neutral-300: oklch(0.870 0.018 291.1); /* #D4D2E0 */\n  --neutral-400: oklch(0.660 0.026 291.1); /* #9290A1 — tuned to 3.12:1 on white so input borders meet non-text contrast */\n  --neutral-500: oklch(0.556 0.028 291.1); /* #737183 */\n  --neutral-600: oklch(0.440 0.028 291.1); /* #525061 */\n  --neutral-700: oklch(0.370 0.028 291.1); /* #403D4E */\n  --neutral-800: oklch(0.270 0.026 291.1); /* #262432 */\n  --neutral-900: oklch(0.205 0.022 291.1); /* #171521 */\n  --neutral-950: oklch(0.145 0.018 291.1); /* #0A0911 */\n\n  /* Accent — the 2026 chart's INDIGO column, carried on the existing --violet-* names (no rename).\n     Step 600 is the source's #6C35FF exactly, no longer chroma-normalised. Assistant / AI moments,\n     accent badges and callouts. NEVER a chart series and never a second primary. */\n  --violet-50:  oklch(0.939 0.035 302.1); /* #EFE6FF */\n  --violet-100: oklch(0.898 0.057 297.5); /* #E1D6FF */\n  --violet-200: oklch(0.813 0.106 296.2); /* #C8B4FF */\n  --violet-300: oklch(0.729 0.157 294.8); /* #AF91FF */\n  --violet-400: oklch(0.648 0.208 293.0); /* #976DFF */\n  --violet-500: oklch(0.581 0.248 289.7); /* #804CFF */\n  --violet-600: oklch(0.538 0.270 285.3); /* #6C35FF  ← the accent */\n  --violet-700: oklch(0.480 0.249 279.5); /* #4F2FE3 */\n  --violet-800: oklch(0.421 0.227 274.4); /* #3527C5 */\n  --violet-900: oklch(0.367 0.203 269.1); /* #1C22A7 */\n  --violet-950: oklch(0.337 0.193 264.6); /* #041F98 */\n\n  /* Status — the 2026 chart's Red, Green and Yellow columns, 1:1 on the existing step numbers.\n     --amber-* keeps its name and carries the chart's YELLOW values (no rename). */\n  --red-50:  oklch(0.912 0.050 49.4); /* #FFD9C5 */\n  --red-100: oklch(0.888 0.052 50.0); /* #F8D1BC */\n  --red-200: oklch(0.843 0.064 45.4); /* #F0BFA9 */\n  --red-300: oklch(0.776 0.093 39.9); /* #EAA289 ← --destructive (red-900 ink on it 4.53:1) */\n  --red-400: oklch(0.704 0.125 33.7); /* #E2816B */\n  --red-500: oklch(0.645 0.138 32.1); /* #D46A56 */\n  --red-600: oklch(0.583 0.147 30.3); /* #C35343 — large text and icon fills only (4.53:1 with white) */\n  --red-700: oklch(0.522 0.154 28.0); /* #B13C33 */\n  --red-800: oklch(0.466 0.157 26.1); /* #9F2726 */\n  --red-900: oklch(0.412 0.158 23.2); /* #8D0E1D — ink on red tints */\n  --red-950: oklch(0.377 0.152 21.7); /* #7F0019 */\n  --green-50:  oklch(0.981 0.035 107.0); /* #FBFBE0 */\n  --green-100: oklch(0.936 0.050 107.3); /* #EDEDC7 */\n  --green-200: oklch(0.857 0.051 107.4); /* #D3D3AD — success surface, under green-900 ink (7.59:1) */\n  --green-300: oklch(0.785 0.053 107.6); /* #BCBC95 ← --success (green-900 ink on it 5.97:1) */\n  --green-400: oklch(0.714 0.055 108.9); /* #A5A67E */\n  --green-500: oklch(0.641 0.055 110.3); /* #8E9069 — 3.31:1 boundary on white */\n  --green-600: oklch(0.568 0.052 110.6); /* #787A56 */\n  --green-700: oklch(0.493 0.047 111.1); /* #626445 */\n  --green-800: oklch(0.418 0.044 111.6); /* #4D4F33 */\n  --green-900: oklch(0.341 0.037 110.3); /* #393A23 — ink on green tints */\n  --green-950: oklch(0.293 0.041 110.7); /* #2D2E15 */\n  --amber-50:  oklch(0.964 0.049 91.8); /* #FFF3CF */\n  --amber-100: oklch(0.928 0.058 81.5); /* #FBE4BC */\n  --amber-200: oklch(0.845 0.084 75.8); /* #ECC58E — warning surface */\n  --amber-300: oklch(0.776 0.090 72.0); /* #DAAD75 ← --warning (amber-900 ink on it 5.56:1) */\n  --amber-400: oklch(0.708 0.095 66.8); /* #C9955E — chart series 3 */\n  --amber-500: oklch(0.641 0.100 61.9); /* #B87E49 — 3.43:1 boundary on white */\n  --amber-600: oklch(0.572 0.102 56.6); /* #A56737 */\n  --amber-700: oklch(0.503 0.102 51.5); /* #915127 */\n  --amber-800: oklch(0.433 0.099 44.7); /* #7C3C1D */\n  --amber-900: oklch(0.358 0.097 38.3); /* #652611 — ink on warning tints */\n  --amber-950: oklch(0.303 0.098 38.5); /* #551600 */\n\n  /* Chart-only primitives — light categorical fills; see guidelines/palette-variants.md.\n     Kept names, new values (2026-09-18): --sky-500 carries the chart's Sky 300 and --rose-500 its\n     Pink 300, so both names sit well lighter than their step number suggests. --plum-200 is the chart's\n     Purple 200 and is chart series 5 only. Every fill takes brand-ink labels, never white. */\n  --rose-500: oklch(0.768 0.063 18.6);  /* #D9A4A4 — chart series 4 (chart Pink 300; lightened 2026-09-18) */\n  --sky-500:  oklch(0.786 0.027 239.2); /* #AABCC9 — chart series 2 (chart Sky 300; lightened 2026-09-18) */\n  --plum-200: oklch(0.851 0.032 289.7); /* #CDCBE2 — chart series 5 */\n\n  /* ───────── SEMANTIC ROLES (shadcn names) ───────── */\n  --background: var(--neutral-50);\n  --foreground: var(--primary-900);\n  --card: oklch(1 0 0);                 /* #FFFFFF */\n  --card-foreground: var(--primary-900);\n  --popover: oklch(1 0 0);\n  --popover-foreground: var(--primary-900);\n  --primary: var(--primary-900);        /* #250D53 */\n  --primary-foreground: oklch(1 0 0);\n  --secondary: var(--primary-100);\n  --secondary-foreground: var(--primary-900);\n  --muted: var(--neutral-100);\n  --muted-foreground: var(--neutral-600);\n  --accent: var(--primary-100);         /* hover / selected surface */\n  --accent-foreground: var(--primary-900);\n  /* Status roles come in TWO pairs per family. A step number is never synonymous with a role: the\n     primitive scale is the available values, the role is how a value is used.\n       STRONG  --<role> / --<role>-foreground   the 300 fill under same-family 900 ink — buttons\n       SUBTLE  --<role>-subtle / --<role>-subtle-foreground   the 100 tint under that same 900 ink — badges\n     Revised 2026-09-21: both pairs are light tints of one family and differ ONLY in fill depth,\n     300 against 100. No status colour uses white text, and none uses brand purple as a label — at 300\n     the ink is the family's own 900, so no two hues compete. Interaction goes LIGHTER, like the primary\n     (destructive hover red-200, pressed red-100); darker breaks the ink (red-400 under red-900 is 3.43).\n     KNOWN LIMIT, accepted 2026-09-21: these fills are too light to act as boundaries. Progress at 100%,\n     success icon fills, the alert borders and the invalid input border land at 1.78–2.09 against the 3:1\n     non-text floor and are accepted as decorative — see contrast-report.md § Documented deviations. */\n  --destructive: var(--red-300);        /* #EAA289 — STRONG fill: destructive button (red-900 ink 4.53:1); hover red-200, pressed red-100 */\n  --destructive-foreground: var(--red-900); /* #8D0E1D */\n  --destructive-subtle: var(--red-100); /* #F8D1BC — SUBTLE surface: destructive badge */\n  --destructive-subtle-foreground: var(--red-900); /* #8D0E1D — ink on --destructive-subtle (6.71:1); destructive TEXT on a neutral ground: error messages, destructive menu items (9.49:1 on white) */\n  --success: var(--green-300);          /* #BCBC95 — STRONG fill: solid success, bars, icon fills (green-900 ink 5.97:1) */\n  --success-foreground: var(--green-900); /* #393A23 */\n  --success-subtle: var(--green-100);   /* #EDEDC7 — SUBTLE surface: success badge, positive stat badge */\n  --success-subtle-foreground: var(--green-900); /* #393A23 — ink on --success-subtle (9.73:1); success text on a neutral ground (11.65:1 on white) */\n  --warning: var(--amber-300);          /* #DAAD75 — STRONG fill (amber-900 ink 5.56:1) */\n  --warning-foreground: var(--amber-900); /* #652611 */\n  --warning-subtle: var(--amber-100);   /* #FBE4BC — SUBTLE surface: warning badge */\n  --warning-subtle-foreground: var(--amber-900); /* #652611 — ink on --warning-subtle (9.20:1); warning text on a neutral ground (10.79:1 on white) */\n  --border: var(--neutral-200);\n  --input: var(--neutral-400);          /* 3.12:1 on card — WCAG 1.4.11 boundary */\n  --ring: var(--primary-600);           /* #65507F — 6.98:1 on white */\n  --overlay: oklch(0.440 0.028 291.1 / 0.5); /* neutral-600 (#525061) at 50% — dialog and sheet backdrop */\n  /* Categorical chart series — light fills, separated by hue and always labelled.\n     Labels on a fill are --primary-900 brand ink (4.81:1 at the worst, on chart-4), never white. */\n  --chart-1: var(--primary-300); /* #A18DBE — light brand purple */\n  --chart-2: var(--sky-500);     /* #AABCC9 */\n  --chart-3: var(--amber-300);   /* #DAAD75 */\n  --chart-4: var(--rose-500);    /* #D9A4A4 */\n  --chart-5: var(--plum-200);    /* #CDCBE2 */\n  --sidebar: oklch(1 0 0);\n  --sidebar-foreground: var(--neutral-700);\n  --sidebar-primary: var(--primary-900);\n  --sidebar-primary-foreground: oklch(1 0 0);\n  --sidebar-accent: var(--primary-100);\n  --sidebar-accent-foreground: var(--primary-900);\n  --sidebar-border: var(--neutral-200);\n  --sidebar-ring: var(--primary-600);\n\n  /* Interaction steps for the dark primary: lighter, never darker. */\n  --primary-hover: var(--primary-800);      /* #3B2559 */\n  --primary-active: var(--primary-700);     /* #513B69 */\n  --primary-subtle: var(--primary-50);      /* #F7F6FE */\n  --primary-disabled: var(--primary-300);   /* #A18DBE */\n\n  /* Shape */\n  --radius: 0.5rem; /* 8px. Code derives sm = radius-4px, md = radius-2px, lg = radius, xl = radius+4px */\n  --radius-sm: calc(var(--radius) - 4px); /* 4px  chips, checkbox, tag */\n  --radius-md: calc(var(--radius) - 2px); /* 6px  buttons, inputs, selects, badges, menu items */\n  --radius-lg: var(--radius);             /* 8px  cards, table container, popovers, callouts */\n  --radius-xl: calc(var(--radius) + 4px); /* 12px dialogs, phone-flow surfaces */\n  --radius-full: 9999px;                  /* avatar, switch, progress track only */\n\n  /* Elevation — purple-tinted, two steps only. */\n  --shadow-sm: 0 1px 3px 0 oklch(0.249 0.116 291.1 / 0.10);\n  --shadow-md: 0 4px 32px 0 oklch(0.249 0.116 291.1 / 0.10);\n\n  /* Type families */\n  --font-sans: \"Instrument Sans\", \"Helvetica Neue\", Helvetica, Arial, system-ui, sans-serif;\n  --font-serif: \"Host Grotesk\", \"Instrument Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif; /* display headings + stat values — Host Grotesk 600 replaced Playfair Display 2026-09-17; the token name is kept to avoid a breaking rename */\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n<\u002Fstyle>\n  <style>/* Lawbrokr 2.0 — typography tokens. Type scale in rem, line-heights unitless-equivalent rem, weights. */\n/* latin-ext */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"77f47c44-57fa-4fd5-94ef-7f61983877bc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"9f96373d-168e-4282-95ce-79a81c6513c6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: normal;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"b56 ; box-shadow: var(--shadow-sm); }\n\n/* Sidebar nav */\n.lb-nav-item { display: flex; align-items: center; gap: var(--space-3); width: 100%; height: 2.25rem; padding: 0 var(--space-3); border: none; border-radius: var(--radius-md); background: transparent; color: var(--sidebar-foreground); font: var(--font-medium) var(--text-sm) / 1 var(--font-sans); text-align: left; cursor: pointer; text-decoration: none; }\n.lb-nav-item svg { width: var(--icon-md); height: var(--icon-md); flex: none; }\n.lb-nav-item:hover { background: var(--muted); color: var(--foreground); }\n.lb-nav-item[aria-current=\"page\"] { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: var(--font-semibold); }\n\n/* Menu / popover */\n.lb-menu { min-width: 12rem; padding: var(--space-1); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }\n.lb-menu__item { display: flex; align-items: center; gap: var(--space-2); width: 100%; height: 2rem; padding: 0 var(--space-2); border: none; background: transparent; border-radius: var(--radius-sm); font: var(--font-normal) var(--text-sm) / 1 var(--font-sans); color: inherit; text-align: left; cursor: pointer; }\n.lb-menu__item:hover, .lb-menu__item:focus-visible { background: var(--accent); color: var(--accent-foreground); outline: none; }\n.lb-menu__item--destructive { color: var(--destructive-subtle-foreground); }\n.lb-menu__sep { height: 1px; margin: var(--space-1) 0; background: var(--border); }\n.lb-tooltip { background: var(--primary-900); color: #fff; font-size: var(--text-xs); line-height: var(--leading-xs); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); width: max-content; max-width: 20rem; text-wrap: pretty; animation: lb-fade var(--duration-fast) var(--ease-out); }\n@keyframes lb-fade { from { opacity: 0; } }\n\n/* Alert / callout — variants: default | brand | destructive | success | warning */\n.lb-alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--card); color: var(--foreground); font-size: var(--text-sm); }\n.lb-alert svg { width: var(--icon-sm); height: var(--icon-sm); flex: none; margin-top: 2px; }\n.lb-alert__title { font-weight: var(--font-semibold); margin: 0; }\n.lb-alert__desc { margin: 2px 0 0; color: var(--muted-foreground); }\n.lb-alert--brand { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }\n.lb-alert--brand .lb-alert__desc { color: oklch(1 0 0 / 0.70); }\n.lb-alert--accent { background: var(--violet-50); border-color: var(--violet-200); }\n.lb-alert--destructive { background: var(--red-50); border-color: var(--red-200); color: var(--red-900); }\n.lb-alert--destructive .lb-alert__desc { color: var(--red-800); }\n.lb-alert--success { background: var(--green-50); border-color: var(--success); color: var(--green-900); }\n.lb-alert--success svg { color: var(--success); }\n.lb-alert--success .lb-alert__desc { color: var(--green-800); }\n.lb-alert--warning { background: var(--amber-50); border-color: var(--amber-200); color: var(--amber-900); }\n.lb-alert--warning .lb-alert__desc { color: var(--amber-800); }\n\n/* Progress, skeleton, avatar, separator */\n.lb-progress { height: 0.5rem; border-radius: var(--radius-full); background: var(--muted); overflow: hidden; }\n.lb-progress__bar { height: 100%; border-radius: var(--radius-full); background: var(--primary); transition: width var(--duration-slow) var(--ease-out); }\n.lb-progress[aria-valuenow=\"100\"] .lb-progress__bar { background: var(--success); }\n.lb-progress--indeterminate .lb-progress__bar { width: 40%; animation: lb-indeterminate 2s var(--ease-in-out) infinite; }\n@keyframes lb-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }\n.lb-skeleton { background: var(--muted); border-radius: var(--radius-sm); animation: lb-pulse 1.6s var(--ease-in-out) infinite; }\n@keyframes lb-pulse { 50% { opacity: 0.55; } }\n.lb-avatar { display: inline-grid; place-content: center; width: 2rem; height: 2rem; border-radius: var(--radius-full); background: var(--primary); color: var(--primary-foreground); font: var(--font-semibold) var(--text-xs) / 1 var(--font-sans); overflow: hidden; flex: none; }\n.lb-avatar--sm { width: 1.5rem; height: 1.5rem; font-size: var(--text-xs); }\n.lb-avatar--lg { width: 2.5rem; height: 2.5rem; font-size: var(--text-sm); }\n.lb-separator { border: none; height: 1px; background: var(--border); margin: 0; }\n.lb-kbd { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 var(--space-1_5); }\n\n/* Dialog */\n.lb-overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: var(--space-4); z-index: 50; }\n/* Sheet — the sidebar rail below lg. Slides from the left over --overlay. */\n.lb-sheet { position: fixed; inset: 0 auto 0 0; width: 17rem; max-width: 85vw; background: var(--sidebar); box-shadow: var(--shadow-md); z-index: 51; animation: lb-slide-in var(--duration-base) var(--ease-out); }\n@keyframes lb-slide-in { from { transform: translateX(-100%); } }\n.lb-dialog { width: 100%; max-width: 28rem; background: var(--card); color: var(--card-foreground); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }\n.lb-dialog__title { margin: 0; font: var(--font-semibold) var(--text-lg) / var(--leading-lg) var(--font-sans); }\n.lb-dialog__desc { margin: 0; color: var(--muted-foreground); font-size: var(--text-sm); }\n.lb-dialog__footer { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n<\u002Fstyle>\n  <style>/* Lawbrokr 2.0 Design System — tokens.css\n   SHIPPED palette: the 2026 hue chart (team decision, 2026-09-17) — Brand purple, Indigo accent,\n   Red / Green / Yellow status — on the purple-tinted neutral scale, which is unchanged.\n   Token step numbers are OURS, not the chart's: #250D53 stays --primary-900 (the chart prints it\n   as Brand 800), so every chart step sits one notch below its token name from 300 down.\n   Family names are unchanged too: --violet-* now carries the chart's Indigo values and --amber-*\n   its Yellow values. The chart palette is five LIGHT fills (2026-09-18): brand purple, sky, yellow,\n   pink and a pale lavender, labelled in brand ink. Teal is gone.\n   Light theme only. Plain CSS custom properties: usable from Tailwind v4 `@theme inline`,\n   Astro, and Lit shadow DOM alike. All colours oklch(); hex equivalents in comments.\n   Semantic roles reference primitives. No dark block. */\n:root {\n  color-scheme: only light;\n\n  /* ───────── PRIMITIVES ───────── */\n  /* Primary (brand purple) — the 2026 chart's Brand column. Step 900 is Lawbrokr purple #250D53\n     exactly (the chart's Brand 800); 300–800 are the chart's 200–700, one notch up, and 950 is the\n     chart's 900. The chart's Brand 50 #BDAEDC, 100 #B2A1D1 and 950 #070043 are not shipped.\n     50 / 100 / 200 are the existing very-light purples, deliberately kept: they are the selected\n     and hover surfaces the whole UI is built on and sit outside the chart. */\n  --primary-50:  oklch(0.977 0.010 291.1); /* #F7F6FE — unchanged */\n  --primary-100: oklch(0.950 0.024 291.1); /* #EEECFE — unchanged */\n  --primary-200: oklch(0.900 0.052 291.1); /* #DDD9FF — unchanged */\n  --primary-300: oklch(0.679 0.074 303.1); /* #A18DBE */\n  --primary-400: oklch(0.616 0.078 305.2); /* #9079AB */\n  --primary-500: oklch(0.546 0.081 305.9); /* #7C6496 */\n  --primary-600: oklch(0.472 0.078 304.1); /* #65507F */\n  --primary-700: oklch(0.397 0.079 305.1); /* #513B69 */\n  --primary-800: oklch(0.319 0.091 300.9); /* #3B2559 */\n  --primary-900: oklch(0.249 0.116 291.1); /* #250D53  ← Lawbrokr Purple */\n  --primary-950: oklch(0.210 0.128 279.4); /* #140050 */\n\n  /* Neutral — tinted toward the purple hue (used by this variant). */\n  --neutral-50:  oklch(0.985 0.004 291.1); /* #FAFAFD */\n  --neutral-100: oklch(0.968 0.007 291.1); /* #F4F4F9 */\n  --neutral-200: oklch(0.928 0.012 291.1); /* #E7E6EF */\n  --neutral-300: oklch(0.870 0.018 291.1); /* #D4D2E0 */\n  --neutral-400: oklch(0.660 0.026 291.1); /* #9290A1 — tuned to 3.12:1 on white so input borders meet non-text contrast */\n  --neutral-500: oklch(0.556 0.028 291.1); /* #737183 */\n  --neutral-600: oklch(0.440 0.028 291.1); /* #525061 */\n  --neutral-700: oklch(0.370 0.028 291.1); /* #403D4E */\n  --neutral-800: oklch(0.270 0.026 291.1); /* #262432 */\n  --neutral-900: oklch(0.205 0.022 291.1); /* #171521 */\n  --neutral-950: oklch(0.145 0.018 291.1); /* #0A0911 */\n\n  /* Accent — the 2026 chart's INDIGO column, carried on the existing --violet-* names (no rename).\n     Step 600 is the source's #6C35FF exactly, no longer chroma-normalised. Assistant / AI moments,\n     accent badges and callouts. NEVER a chart series and never a second primary. */\n  --violet-50:  oklch(0.939 0.035 302.1); /* #EFE6FF */\n  --violet-100: oklch(0.898 0.057 297.5); /* #E1D6FF */\n  --violet-200: oklch(0.813 0.106 296.2); /* #C8B4FF */\n  --violet-300: oklch(0.729 0.157 294.8); /* #AF91FF */\n  --violet-400: oklch(0.648 0.208 293.0); /* #976DFF */\n  --violet-500: oklch(0.581 0.248 289.7); /* #804CFF */\n  --violet-600: oklch(0.538 0.270 285.3); /* #6C35FF  ← the accent */\n  --violet-700: oklch(0.480 0.249 279.5); /* #4F2FE3 */\n  --violet-800: oklch(0.421 0.227 274.4); /* #3527C5 */\n  --violet-900: oklch(0.367 0.203 269.1); /* #1C22A7 */\n  --violet-950: oklch(0.337 0.193 264.6); /* #041F98 */\n\n  /* Status — the 2026 chart's Red, Green and Yellow columns, 1:1 on the existing step numbers.\n     --amber-* keeps its name and carries the chart's YELLOW values (no rename). */\n  --red-50:  oklch(0.912 0.050 49.4); /* #FFD9C5 */\n  --red-100: oklch(0.888 0.052 50.0); /* #F8D1BC */\n  --red-200: oklch(0.843 0.064 45.4); /* #F0BFA9 */\n  --red-300: oklch(0.776 0.093 39.9); /* #EAA289 ← --destructive (red-900 ink on it 4.53:1) */\n  --red-400: oklch(0.704 0.125 33.7); /* #E2816B */\n  --red-500: oklch(0.645 0.138 32.1); /* #D46A56 */\n  --red-600: oklch(0.583 0.147 30.3); /* #C35343 — large text and icon fills only (4.53:1 with white) */\n  --red-700: oklch(0.522 0.154 28.0); /* #B13C33 */\n  --red-800: oklch(0.466 0.157 26.1); /* #9F2726 */\n  --red-900: oklch(0.412 0.158 23.2); /* #8D0E1D — ink on red tints */\n  --red-950: oklch(0.377 0.152 21.7); /* #7F0019 */\n  --green-50:  oklch(0.981 0.035 107.0); /* #FBFBE0 */\n  --green-100: oklch(0.936 0.050 107.3); /* #EDEDC7 */\n  --green-200: oklch(0.857 0.051 107.4); /* #D3D3AD — success surface, under green-900 ink (7.59:1) */\n  --green-300: oklch(0.785 0.053 107.6); /* #BCBC95 ← --success (green-900 ink on it 5.97:1) */\n  --green-400: oklch(0.714 0.055 108.9); /* #A5A67E */\n  --green-500: oklch(0.641 0.055 110.3); /* #8E9069 — 3.31:1 boundary on white */\n  --green-600: oklch(0.568 0.052 110.6); /* #787A56 */\n  --green-700: oklch(0.493 0.047 111.1); /* #626445 */\n  --green-800: oklch(0.418 0.044 111.6); /* #4D4F33 */\n  --green-900: oklch(0.341 0.037 110.3); /* #393A23 — ink on green tints */\n  --green-950: oklch(0.293 0.041 110.7); /* #2D2E15 */\n  --amber-50:  oklch(0.964 0.049 91.8); /* #FFF3CF */\n  --amber-100: oklch(0.928 0.058 81.5); /* #FBE4BC */\n  --amber-200: oklch(0.845 0.084 75.8); /* #ECC58E — warning surface */\n  --amber-300: oklch(0.776 0.090 72.0); /* #DAAD75 ← --warning (amber-900 ink on it 5.56:1) */\n  --amber-400: oklch(0.708 0.095 66.8); /* #C9955E — chart series 3 */\n  --amber-500: oklch(0.641 0.100 61.9); /* #B87E49 — 3.43:1 boundary on white */\n  --amber-600: oklch(0.572 0.102 56.6); /* #A56737 */\n  --amber-700: oklch(0.503 0.102 51.5); /* #915127 */\n  --amber-800: oklch(0.433 0.099 44.7); /* #7C3C1D */\n  --amber-900: oklch(0.358 0.097 38.3); /* #652611 — ink on warning tints */\n  --amber-950: oklch(0.303 0.098 38.5); /* #551600 */\n\n  /* Chart-only primitives — light categorical fills; see guidelines/palette-variants.md.\n     Kept names, new values (2026-09-18): --sky-500 carries the chart's Sky 300 and --rose-500 its\n     Pink 300, so both names sit well lighter than their step number suggests. --plum-200 is the chart's\n     Purple 200 and is chart series 5 only. Every fill takes brand-ink labels, never white. */\n  --rose-500: oklch(0.768 0.063 18.6);  /* #D9A4A4 — chart series 4 (chart Pink 300; lightened 2026-09-18) */\n  --sky-500:  oklch(0.786 0.027 239.2); /* #AABCC9 — chart series 2 (chart Sky 300; lightened 2026-09-18) */\n  --plum-200: oklch(0.851 0.032 289.7); /* #CDCBE2 — chart series 5 */\n\n  /* ───────── SEMANTIC ROLES (shadcn names) ───────── */\n  --background: var(--neutral-50);\n  --foreground: var(--primary-900);\n  --card: oklch(1 0 0);                 /* #FFFFFF */\n  --card-foreground: var(--primary-900);\n  --popover: oklch(1 0 0);\n  --popover-foreground: var(--primary-900);\n  --primary: var(--primary-900);        /* #250D53 */\n  --primary-foreground: oklch(1 0 0);\n  --secondary: var(--primary-100);\n  --secondary-foreground: var(--primary-900);\n  --muted: var(--neutral-100);\n  --muted-foreground: var(--neutral-600);\n  --accent: var(--primary-100);         /* hover / selected surface */\n  --accent-foreground: var(--primary-900);\n  /* Status roles come in TWO pairs per family. A step number is never synonymous with a role: the\n     primitive scale is the available values, the role is how a value is used.\n       STRONG  --<role> / --<role>-foreground   the 300 fill under same-family 900 ink — buttons\n       SUBTLE  --<role>-subtle / --<role>-subtle-foreground   the 100 tint under that same 900 ink — badges\n     Revised 2026-09-21: both pairs are light tints of one family and differ ONLY in fill depth,\n     300 against 100. No status colour uses white text, and none uses brand purple as a label — at 300\n     the ink is the family's own 900, so no two hues compete. Interaction goes LIGHTER, like the primary\n     (destructive hover red-200, pressed red-100); darker breaks the ink (red-400 under red-900 is 3.43).\n     KNOWN LIMIT, accepted 2026-09-21: these fills are too light to act as boundaries. Progress at 100%,\n     success icon fills, the alert borders and the invalid input border land at 1.78–2.09 against the 3:1\n     non-text floor and are accepted as decorative — see contrast-report.md § Documented deviations. */\n  --destructive: var(--red-300);        /* #EAA289 — STRONG fill: destructive button (red-900 ink 4.53:1); hover red-200, pressed red-100 */\n  --destructive-foreground: var(--red-900); /* #8D0E1D */\n  --destructive-subtle: var(--red-100); /* #F8D1BC — SUBTLE surface: destructive badge */\n  --destructive-subtle-foreground: var(--red-900); /* #8D0E1D — ink on --destructive-subtle (6.71:1); destructive TEXT on a neutral ground: error messages, destructive menu items (9.49:1 on white) */\n  --success: var(--green-300);          /* #BCBC95 — STRONG fill: solid success, bars, icon fills (green-900 ink 5.97:1) */\n  --success-foreground: var(--green-900); /* #393A23 */\n  --success-subtle: var(--green-100);   /* #EDEDC7 — SUBTLE surface: success badge, positive stat badge */\n  --success-subtle-foreground: var(--green-900); /* #393A23 — ink on --success-subtle (9.73:1); success text on a neutral ground (11.65:1 on white) */\n  --warning: var(--amber-300);          /* #DAAD75 — STRONG fill (amber-900 ink 5.56:1) */\n  --warning-foreground: var(--amber-900); /* #652611 */\n  --warning-subtle: var(--amber-100);   /* #FBE4BC — SUBTLE surface: warning badge */\n  --warning-subtle-foreground: var(--amber-900); /* #652611 — ink on --warning-subtle (9.20:1); warning text on a neutral ground (10.79:1 on white) */\n  --border: var(--neutral-200);\n  --input: var(--neutral-400);          /* 3.12:1 on card — WCAG 1.4.11 boundary */\n  --ring: var(--primary-600);           /* #65507F — 6.98:1 on white */\n  --overlay: oklch(0.440 0.028 291.1 / 0.5); /* neutral-600 (#525061) at 50% — dialog and sheet backdrop */\n  /* Categorical chart series — light fills, separated by hue and always labelled.\n     Labels on a fill are --primary-900 brand ink (4.81:1 at the worst, on chart-4), never white. */\n  --chart-1: var(--primary-300); /* #A18DBE — light brand purple */\n  --chart-2: var(--sky-500);     /* #AABCC9 */\n  --chart-3: var(--amber-300);   /* #DAAD75 */\n  --chart-4: var(--rose-500);    /* #D9A4A4 */\n  --chart-5: var(--plum-200);    /* #CDCBE2 */\n  --sidebar: oklch(1 0 0);\n  --sidebar-foreground: var(--neutral-700);\n  --sidebar-primary: var(--primary-900);\n  --sidebar-primary-foreground: oklch(1 0 0);\n  --sidebar-accent: var(--primary-100);\n  --sidebar-accent-foreground: var(--primary-900);\n  --sidebar-border: var(--neutral-200);\n  --sidebar-ring: var(--primary-600);\n\n  /* Interaction steps for the dark primary: lighter, never darker. */\n  --primary-hover: var(--primary-800);      /* #3B2559 */\n  --primary-active: var(--primary-700);     /* #513B69 */\n  --primary-subtle: var(--primary-50);      /* #F7F6FE */\n  --primary-disabled: var(--primary-300);   /* #A18DBE */\n\n  /* Shape */\n  --radius: 0.5rem; /* 8px. Code derives sm = radius-4px, md = radius-2px, lg = radius, xl = radius+4px */\n  --radius-sm: calc(var(--radius) - 4px); /* 4px  chips, checkbox, tag */\n  --radius-md: calc(var(--radius) - 2px); /* 6px  buttons, inputs, selects, badges, menu items */\n  --radius-lg: var(--radius);             /* 8px  cards, table container, popovers, callouts */\n  --radius-xl: calc(var(--radius) + 4px); /* 12px dialogs, phone-flow surfaces */\n  --radius-full: 9999px;                  /* avatar, switch, progress track only */\n\n  /* Elevation — purple-tinted, two steps only. */\n  --shadow-sm: 0 1px 3px 0 oklch(0.249 0.116 291.1 / 0.10);\n  --shadow-md: 0 4px 32px 0 oklch(0.249 0.116 291.1 / 0.10);\n\n  /* Type families */\n  --font-sans: \"Instrument Sans\", \"Helvetica Neue\", Helvetica, Arial, system-ui, sans-serif;\n  --font-serif: \"Host Grotesk\", \"Instrument Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif; /* display headings + stat values — Host Grotesk 600 replaced Playfair Display 2026-09-17; the token name is kept to avoid a breaking rename */\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n\n/* Lawbrokr 2.0 — typography tokens. Type scale in rem, line-heights unitless-equivalent rem, weights. */\n/* latin-ext */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"77f47c44-57fa-4fd5-94ef-7f61983877bc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"9f96373d-168e-4282-95ce-79a81c6513c6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Host Grotesk';\n  font-style: normal;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"b5640fd7-3cb0-4c3f-a3b0-ed7217f85b7a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/ \u002Fdiv>\n\n        <section style=\"background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px; align-items: center;\">\n          <div style=\"display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n            <div style=\"position: relative; width: 140px; height: 140px; flex-shrink: 0;\">\n              <svg width=\"140\" height=\"140\" sc-camel-view-box=\"0 0 160 160\" style=\"display: block;\">\n                <circle cx=\"80\" cy=\"80\" r=\"68\" style=\"fill: none; stroke: var(--neutral-200); stroke-width: 12px;\"><\u002Fcircle>\n                <circle cx=\"80\" cy=\"80\" r=\"68\" transform=\"rotate(-90 80 80)\" style=\"fill: none; stroke: var(--primary-900); stroke-width: 12px; stroke-dasharray: 427.26; stroke-dashoffset: {{ ringOffsetFull }};\"><\u002Fcircle>\n              <\u002Fsvg>\n              <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;\">\n                <span style=\"font-family: var(--font-serif); font-weight: 600; font-size: 44px; line-height: 1; color: var(--primary-900); font-variant-numeric: tabular-nums;\">{{ overall }}<\u002Fspan>\n                <span style=\"font-size: 12px; color: var(--muted-foreground); margin-top: 4px;\">out of 100<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start;\">\n              <x-import component-from-global-scope=\"Lawbrokr20DesignSystem_663882.Badge\" variant=\"{{ overallBand.variant }}\" hint-size=\"96px,22px\">{{ overallBand.label }}<\u002Fx-import>\n              <p style=\"margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 20px; line-height: 26px; color: var(--primary-900); text-wrap: pretty;\">{{ gateHeadline }}<\u002Fp>\n              <sc-if value=\"{{ hasGuess }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 14px; line-height: 21px; color: var(--muted-foreground);\">{{ reportGuess }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground);\">Fix these first<\u002Fspan>\n            <sc-for list=\"{{ priorities }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n                <span style=\"width: 24px; height: 24px; flex-shrink: 0; border-radius: var(--radius-md); background: var(--primary-100); color: var(--primary-900); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;\">{{ p.n }}<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0;\">\n                  <span style=\"font-size: 14px; font-weight: 600; color: var(--primary-900);\">{{ p.title }}<\u002Fspan>\n                  <span style=\"font-size: 13px; line-height: 19px; color: var(--muted-foreground); text-wrap: pretty;\">{{ p.short }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px;\">\n          <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <section style=\"background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; display: flex; flex-direction: column; gap: 18px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px;\">\n                <span style=\"width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--radius-md); background: var(--primary-100); color: var(--primary-900); display: flex; align-items: center; justify-content: center;\">\n                  <x-import component-from-global-scope=\"Lawbrokr20DesignSystem_663882.Icon\" name=\"{{ c.icon }}\" size=\"{{ 16 }}\" hint-size=\"16px,16px\"><\u002Fx-import>\n                <\u002Fspan>\n                <span style=\"flex: 1; min-width: 0; font-size: 16px; font-weight: 600; color: var(--primary-900);\">{{ c.title }}<\u002Fspan>\n                <x-import component-from-global-scope=\"Lawbrokr20DesignSystem_663882.Badge\" variant=\"{{ c.variant }}\" hint-size=\"88px,22px\">{{ c.bandLabel }}<\u002Fx-import>\n                <span style=\"font-size: 14px; font-weight: 600; color: var(--primary-900); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right;\">{{ c.scoreText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;\">\n                <span style=\"font-family: var(--font-serif); font-weight: 600; font-size: 36px; line-height: 1; color: var(--primary-900); font-variant-numeric: tabular-nums;\">{{ c.metric }}<\u002Fspan>\n                <span style=\"font-size: 14px; color: var(--muted-foreground);\">{{ c.metricLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) auto; align-items: center; gap: 12px;\">\n                    <span style=\"font-size: 13px; color: {{ r.labelColor }}; font-weight: {{ r.weight }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.label }}<\u002Fspan>\n                    <div style=\"height: 10px; background: var(--neutral-100); border-radius: 2px; overflow: hidden;\">\n                      <div style=\"height: 100%; width: {{ r.pct }}; background: {{ r.color }}; border-radius: 2px; transition: width 300ms ease-out;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size: 13px; color: var(--primary-900); font-weight: {{ r.weight }}; font-variant-numeric: tabular-nums; white-space: nowrap;\">{{ r.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px;\">\n                <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground);\">What to do<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 21px; color: var(--primary-900); text-wrap: pretty;\">{{ c.fix }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section style=\"background: var(--primary-900); border-radius: var(--radius-lg); padding: 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px;\">\n          <div style=\"display: flex; gap: 20px; align-items: flex-start; flex: 1 1 420px; min-width: 0;\">\n            <img src=\"55e6f904-6d06-469d-81d2-ce0897f4ff7c\" alt=\"\" style=\"width: 36px; height: 36px; flex-shrink: 0;\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <h2 style=\"margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 26px; line-height: 1.2; color: var(--primary-foreground); text-wrap: balance;\">Turn the traffic you already have into consultations.<\u002Fh2>\n              <p style=\"margin: 0; font-size: 15px; line-height: 22px; color: var(--primary-100); text-wrap: pretty;\">Lawbrokr puts a short, chat-style intake in front of every visitor. We’ll show you where it fits on your site.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"Lawbrokr20DesignSystem_663882.Button\" variant=\"secondary\" size=\"lg\" href=\"https://meetings.hubspot.com/jgutmann/discovery-call-website\" target=\"_blank\" rel=\"noopener\" hint-size=\"240px,44px\">Book a 15-minute walkthrough<\u002Fx-import>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;low&quot;,&quot;mid&quot;,&quot;high&quot;],&quot;default&quot;:&quot;mid&quot;,&quot;tsType&quot;:&quot;'low' | 'mid' | 'high'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;startStep&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;scan&quot;,&quot;gate&quot;,&quot;report&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;'start' | 'scan' | 'gate' | 'report'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;scanSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:14,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Flow&quot;},&quot;phoneRequired&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flow&quot;}}\">\nconst CHECKS = [\n  { key: 'reviews', icon: 'Star', title: 'Google reviews', blurb: 'Your rating and review count against the three closest competitors.',\n    steps: ['Finding your Google Business Profile', 'Locating competitors within 10 miles', 'Comparing ratings and review counts'] },\n  { key: 'speed', icon: 'Gauge', title: 'Load speed', blurb: 'How long your site takes to appear on a phone and on desktop.',\n    steps: ['Loading your homepage on a mid-range phone', 'Measuring largest contentful paint', 'Repeating the test on desktop'] },\n  { key: 'bounce', icon: 'LogOut', title: 'Bounce rate', blurb: 'How many visitors leave after a single page.',\n    steps: ['Estimating engagement from traffic panels', 'Comparing against legal-industry benchmarks'] },\n  { key: 'traffic', icon: 'TrendingUp', title: 'Traffic volume', blurb: 'Estimated monthly visits, and where they come from.',\n    steps: ['Estimating monthly visits', 'Splitting sources: search, direct, referral'] },\n  { key: 'visibility', icon: 'Sparkles', title: 'SEO & GEO visibility', blurb: 'How often Google and AI assistants recommend your firm.',\n    steps: ['Checking 40 local practice-area searches', 'Asking ChatGPT, Perplexity and AI Overviews who to hire', 'Scoring citations and directory mentions'] },\n];\nconst SCEN = {\n  low:  { rating: 4.1, reviews: 23,  mobile: 7.4, desktop: 3.6, bounce: 71, visits: 860,  seo: 38, geo: 9 },\n  mid:  { rating: 4.4, reviews: 61,  mobile: 5.2, desktop: 2.4, bounce: 58, visits: 2140, seo: 62, geo: 24 },\n  high: { rating: 4.9, reviews: 318, mobile: 2.1, desktop: 1.1, bounce: 39, visits: 7900, seo: 88, geo: 71 },\n};\nconst COMPETITORS = [\n  { name: 'Hartley & Moss', rating: 4.7, reviews: 212 },\n  { name: 'Reyes Injury Law', rating: 4.6, reviews: 158 },\n  { name: 'Kline Legal Group', rating: 4.8, reviews: 96 },\n];\nconst PRACTICES = ['Personal injury', 'Family law', 'Criminal defense', 'Immigration', 'Estate planning', 'Employment', 'Other'];\nconst CIRC = 427.26;\nconst GUESSES = [{ key: 'a', label: 'Under 40', lo: 0, hi: 39 }, { key: 'b', label: '40–59', lo: 40, hi: 59 }, { key: 'c', label: '60–79', lo: 60, hi: 79 }, { key: 'd', label: '80 or more', lo: 80, hi: 100 }];\nconst QUIZ = [\n  { key: 'guess', title: 'Guess your health score', hint: 'Most firms guess high.', options: GUESSES.map(g => g.label) },\n  { key: 'goal', title: 'What do you want more of?', hint: 'We’ll put the fixes that get you there first.', options: ['New client calls', '5-star reviews', 'Page 1 on Google', 'Mentions in ChatGPT'] },\n  { key: 'reply', title: 'How fast do you reply to a new web lead?', hint: 'The first firm to reply usually gets the call.', options: ['Under 5 minutes', 'Within an hour', 'Same day', 'Next day or later'] },\n  { key: 'source', title: 'Where do most new clients find you?', hint: 'Helps us weigh what matters in your score.', options: ['Referrals', 'Google search', 'Paid ads', 'Social media'] },\n];\nconst GOAL_CAT = { 'New client calls': 'bounce', '5-star reviews': 'reviews', 'Page 1 on Google': 'visibility', 'Mentions in ChatGPT': 'visibility' };\nconst clamp = (n) => Math.max(0, Math.min(100, Math.round(n)));\nconst fmt = (n) => n.toLocaleString('en-US');\nconst band = (s) => s >= 80 ? { label: 'Healthy', variant: 'success' } : s >= 50 ? { label: 'Room to grow', variant: 'warning' } : { label: 'Needs attention', variant: 'destructive' };\nconst cleanDomain = (u) => (u || '').trim().replace(/^https?:\\/\\//i, '').replace(/^www\\./i, '').replace(/\\/.*$/, '').toLowerCase();\n\nclass Component extends DCLogic {\n  state = { answers: {}, qi: 0, step: 'start', url: '', urlError: '', progress: 0, shownScore: 0,\n    name: '', email: '', phone: '', practice: '', wantsCall: true, errors: {}, submitting: false };\n\n  componentDidMount() { const s = this.props.startStep; if (s && s !== 'start') this.jump(s); }\n  componentDidUpdate(prev) {\n    this.scrollFindings();\n    if (prev.startStep !== this.props.startStep) this.jump(this.props.startStep || 'start');\n    else if (prev.scenario !== this.props.scenario && this.state.step === 'gate') this.countUp();\n  }\n  findRef = React.createRef();\n  componentWillUnmount() { this.stop(); clearTimeout(this.qt); }\n  scrollFindings() {\n    const el = this.findRef.current;\n    if (el && el.scrollHeight !== this._lastH) { this._lastH = el.scrollHeight; el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); }\n  }\n  stop() { clearInterval(this.iv); clearTimeout(this.to); cancelAnimationFrame(this.raf); }\n\n  jump(step) {\n    this.stop();\n    const url = this.state.url || 'smithinjurylaw.com';\n    if (step === 'scan') this.setState({ url }, () => this.startScan());\n    else if (step === 'gate') this.setState({ url, step: 'gate', progress: 100 }, () => this.countUp());\n    else if (step === 'report') this.setState({ url, step: 'report', progress: 100 });\n    else this.setState({ step: 'start', progress: 0 });\n  }\n\n  startScan() {\n    this.stop();\n    const secs = this.props.scanSeconds ?? 14;\n    const inc = 100 / (secs * 1000 / 80);\n    this.setState({ step: 'scan', progress: 0 });\n    this.iv = setInterval(() => {\n      const p = Math.min(100, this.state.progress + inc * (0.6 + Math.random() * 0.8));\n      this.setState({ progress: p });\n      if (p >= 100) { clearInterval(this.iv); this.to = setTimeout(() => this.setState({ step: 'gate' }, () => this.countUp()), 700); }\n    }, 80);\n  }\n\n  countUp() {\n    cancelAnimationFrame(this.raf);\n    const target = this.data().overall, t0 = performance.now(), dur = 1200;\n    const tick = (t) => {\n      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n      this.setState({ shownScore: Math.round(target * e) });\n      if (k < 1) this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n\n  data() {\n    const d = SCEN[this.props.scenario ?? 'mid'] || SCEN.mid;\n    const avgRev = COMPETITORS.reduce((a, c) => a + c.reviews, 0) / COMPETITORS.length;\n    const avgRating = COMPETITORS.reduce((a, c) => a + c.rating, 0) / COMPETITORS.length;\n    const s = {\n      reviews: clamp((d.rating - 3.5) / 1.5 * 50 + Math.min(d.reviews / avgRev, 1.2) / 1.2 * 50),\n      speed: clamp(100 - (d.mobile - 1.5) * 15),\n      bounce: clamp(100 - (d.bounce - 30) * 2),\n      traffic: clamp(Math.min(95, d.visits / 5000 * 100)),\n      visibility: clamp(d.seo * 0.6 + d.geo * 0.4),\n    };\n    const overall = clamp(Object.values(s).reduce((a, b) => a + b, 0) / 5);\n    return { d, s, overall, avgRev, avgRating };\n  }\n\n  buildCategories(domain) {\n    const { d, s, avgRev } = this.data();\n    const you = domain || 'Your firm';\n    const hi = 'var(--chart-1)', lo = 'var(--chart-5)';\n    const row = (label, value, pct, mine) => ({ label, value, pct: Math.max(2, Math.min(100, pct)) + '%', color: mine ? hi : lo,\n      labelColor: mine ? 'var(--primary-900)' : 'var(--muted-foreground)', weight: mine ? 600 : 400 });\n    const maxRev = Math.max(d.reviews, ...COMPETITORS.map(c => c.reviews));\n    const need = Math.max(0, Math.round(avgRev - d.reviews));\n    const avgVisits = 4600, topVisits = 9200;\n    const geoHits = Math.round(d.geo / 100 * 12);\n    const cats = [\n      { key: 'reviews', metric: d.rating.toFixed(1), metricLabel: `average rating from ${fmt(d.reviews)} Google reviews`,\n        rows: [row(you, `${d.rating.toFixed(1)} · ${fmt(d.reviews)}`, d.reviews / maxRev * 100, true),\n          ...COMPETITORS.map(c => row(c.name, `${c.rating.toFixed(1)} · ${fmt(c.reviews)}`, c.reviews / maxRev * 100, false))],\n        fix: s.reviews >= 80 ? 'You lead nearby firms on reviews. Keep asking every closed client, and reply to each review within a week.'\n          : `Ask every closed client for a review. You need about ${fmt(need)} more to match the local average.` },\n      { key: 'speed', metric: `${d.mobile.toFixed(1)}s`, metricLabel: 'to load on a phone',\n        rows: [row('Mobile', `${d.mobile.toFixed(1)}s`, d.mobile / 8 * 100, true), row('Desktop', `${d.desktop.toFixed(1)}s`, d.desktop / 8 * 100, true), row('Google’s target', '2.5s', 2.5 / 8 * 100, false)],\n        fix: s.speed >= 80 ? 'Fast on both devices. Re-test whenever you add a new chat widget or tracking script.'\n          : 'Compress hero images and load chat widgets after the page. Most visitors give up on a phone page that takes over 3 seconds.' },\n      { key: 'bounce', metric: `${d.bounce}%`, metricLabel: 'of visitors leave after one page',\n        rows: [row(you, `${d.bounce}%`, d.bounce, true), row('Legal average', '52%', 52, false), row('Top firms nearby', '38%', 38, false)],\n        fix: s.bounce >= 80 ? 'Visitors stick around. Make sure every page ends in one clear next step.'\n          : 'Visitors leave without acting. Put one clear next step above the fold, like a short intake instead of a long contact form.' },\n      { key: 'traffic', metric: fmt(d.visits), metricLabel: 'estimated visits a month',\n        rows: [row(you, fmt(d.visits), d.visits / topVisits * 100, true), row('Nearby average', fmt(avgVisits), avgVisits / topVisits * 100, false), row('Top nearby firm', fmt(topVisits), 100, false)],\n        fix: s.traffic >= 80 ? 'You out-draw nearby firms. The priority now is turning that traffic into consultations.'\n          : `The average firm nearby gets ${(avgVisits / d.visits).toFixed(1)}× your visits. Most of the gap is local search, so start with your Google Business Profile and practice-area pages.` },\n      { key: 'visibility', metric: `${geoHits} of 12`, metricLabel: 'AI answers that mention your firm',\n        rows: [row('Search (SEO)', `${d.seo}/100`, d.seo, true), row('AI answers (GEO)', `${d.geo}/100`, d.geo, true), row('Nearby average', '58/100', 58, false)],\n        fix: s.visibility >= 80 ? 'Search engines and AI assistants both know you. Keep your firm details identical everywhere they’re listed.'\n          : 'Add practice-area FAQs and keep your name, address and phone identical across directories so AI assistants can cite you.' },\n    ];\n    const short = { reviews: 'Ask every closed client for a review.', speed: 'Cut mobile load time under 3 seconds.', bounce: 'Give visitors one clear next step.', traffic: 'Grow local search traffic.', visibility: 'Get cited in AI answers.' };\n    return cats.map((c, i) => {\n      const meta = CHECKS.find(k => k.key === c.key), b = band(s[c.key]);\n      return { ...c, icon: meta.icon, title: meta.title, score: s[c.key], scorePct: s[c.key] + '%', scoreText: `${s[c.key]}/100`, variant: b.variant, bandLabel: b.label, short: short[c.key] };\n    });\n  }\n\n  renderVals() {\n    const st = this.state, p = st.progress;\n    const domain = cleanDomain(st.url) || 'yourfirm.com';\n    const { overall, s } = this.data();\n    const secs = this.props.scanSeconds ?? 14;\n    const phoneRequired = this.props.phoneRequired ?? false;\n\n    const scanChecks = CHECKS.map((c, i) => {\n      const a = i * 20, b = a + 20;\n      const done = p >= b, active = !done && p >= a;\n      const stepIdx = Math.min(c.steps.length - 1, Math.floor((p - a) / 20 * c.steps.length));\n      return { ...c, isDone: done, isActive: active,\n        detail: done ? 'Done' : active ? c.steps[stepIdx] + '…' : 'Queued',\n        borderTop: i ? '1px solid var(--border)' : '0',\n        rowBg: active ? 'var(--primary-50)' : 'var(--card)',\n        iconBg: done || active ? 'var(--primary-100)' : 'var(--neutral-100)',\n        iconFg: done || active ? 'var(--primary-900)' : 'var(--neutral-500)',\n        titleColor: done || active ? 'var(--primary-900)' : 'var(--muted-foreground)' };\n    });\n    const all = [{ t: 0.5, text: `Connecting to https://${domain}` }];\n    CHECKS.forEach((c, i) => c.steps.forEach((m, j) => all.push({ t: i * 20 + (j / c.steps.length) * 20 + 1, text: m })));\n    const seen = all.filter(l => p >= l.t);\n    const logs = seen.slice(-9).map((l, k, arr) => {\n      const sec = Math.round(l.t / 100 * secs);\n      return { time: `00:${String(sec).padStart(2, '0')}`, text: l.text, color: k === arr.length - 1 && p < 100 ? 'var(--primary-foreground)' : 'var(--primary-200)' };\n    });\n    if (p >= 100) logs.push({ time: `00:${String(secs).padStart(2, '0')}`, text: 'Audit complete. Scoring…', color: 'var(--primary-foreground)' });\n    const activeIdx = Math.min(4, Math.floor(p / 20));\n\n    const cats = this.buildCategories(domain);\n    const ob = band(overall);\n    const issues = Object.values(s).reduce((a, v) => a + (v < 50 ? 2 : v < 80 ? 1 : 0), 0);\n    const gateHeadline = issues === 0 ? 'Your marketing is in good shape.'\n      : `We found ${issues} things likely costing you consultations.`;\n    const gateSub = issues === 0 ? 'The full report shows where you can still pull ahead of the firms near you.'\n      : 'Your full report breaks down each score against the three closest firms, with the fixes that matter most.';\n\n    const dd = this.data().d;\n    const DISC = [\n      { t: 7, icon: 'MapPin', title: 'Found your Google Business Profile', detail: `${dd.rating.toFixed(1)} rating from ${fmt(dd.reviews)} reviews` },\n      { t: 15, icon: 'Users', title: 'Spotted 3 competitors within 10 miles', detail: COMPETITORS.map(c => c.name).join(', '),\n        avatars: COMPETITORS.map(c => ({ initials: c.name.split(/\\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('') })) },\n      { t: 31, icon: 'Smartphone', title: `Your homepage took ${dd.mobile.toFixed(1)}s to load on a phone`, detail: 'Google’s target is 2.5s. Trying desktop next.' },\n      { t: 50, icon: 'MousePointerClick', title: 'Followed visitors through 42 pages', detail: 'Seeing where they leave, and comparing to other law firms.' },\n      { t: 70, icon: 'TrendingUp', title: `About ${fmt(dd.visits)} people visit each month`, detail: 'Now working out where they come from.' },\n      { t: 87, icon: 'Sparkles', title: 'Asked AI assistants who to hire near you', detail: 'Which ones named you is in your report.', chips: ['ChatGPT', 'Perplexity', 'AI Overviews'] },\n    ];\n    const discoveries = DISC.filter(x => p >= x.t).map(x => ({ ...x, hasAvatars: !!x.avatars, hasChips: !!x.chips, avatars: x.avatars || [], chips: x.chips || [] }));\n    const ans = st.answers, guessSel = GUESSES.find(g => g.label === ans.guess);\n    const qi = Math.min(st.qi, QUIZ.length), cq = QUIZ[qi];\n    const reportGuess = guessSel ? `You guessed ${guessSel.label} and scored ${overall}. ${overall >= guessSel.lo && overall <= guessSel.hi ? 'Spot on.' : guessSel.lo > overall ? 'Most firms guess high.' : 'Better than you expected.'}` : '';\n    const er = st.errors;\n    const set = (k) => (e) => this.setState({ [k]: e && e.target ? e.target.value : e, errors: { ...this.state.errors, [k]: undefined } });\n\n    return {\n      fullBtn: { style: { width: '100%', justifyContent: 'center' } },\n      isStart: st.step === 'start', isScan: st.step === 'scan', isGate: st.step === 'gate', isReport: st.step === 'report',\n      url: st.url, urlInvalid: !!st.urlError, urlError: st.urlError, domain,\n      onUrl: (e) => this.setState({ url: e.target.value, urlError: '' }),\n      submitUrl: (e) => {\n        e.preventDefault();\n        const d = cleanDomain(st.url);\n        if (!/^[a-z0-9-]+(\\.[a-z0-9-]+)+$/.test(d)) { this.setState({ urlError: 'Enter your firm’s website, like smithlaw.com' }); return; }\n        this.startScan();\n      },\n      checkList: CHECKS,\n      scanChecks, logs, progress: Math.round(p), progressText: `${Math.floor(p)}%`,\n      scanStatus: p >= 100 ? 'Scoring your results' : `Step ${activeIdx + 1} of 5 · ${CHECKS[activeIdx].title}`,\n      pagesText: `${Math.round(p / 100 * 42)} pages read`,\n\n      quizOverline: cq ? `While you wait · ${qi + 1} of ${QUIZ.length}` : 'While you wait',\n      quizDots: QUIZ.map((x, i) => ({ bg: ans[x.key] || i < qi ? 'var(--primary-900)' : i === qi ? 'var(--primary-300)' : 'var(--neutral-200)' })),\n      quizActive: !!cq, quizDone: !cq,\n      q: cq ? { title: cq.title, hint: cq.hint, options: cq.options.map(o => ({ label: o, variant: ans[cq.key] === o ? 'default' : 'outline', pressed: ans[cq.key] === o,\n        pick: () => { this.setState({ answers: { ...this.state.answers, [cq.key]: o } }); clearTimeout(this.qt); this.qt = setTimeout(() => this.setState(s => ({ qi: s.qi + 1 })), 350); } })) } : { options: [] },\n      skipQ: () => this.setState(s => ({ qi: s.qi + 1 })),\n      resetQuiz: () => this.setState({ answers: {}, qi: 0 }),\n      quizSummary: ans.goal ? `We’ll lead with what gets you more ${ans.goal.replace(/^New /, 'new ').replace('Page 1 on Google', 'page 1 rankings').replace('Mentions in ChatGPT', 'AI mentions').toLowerCase()}.` : 'Your answers shape what we show first.',\n      hasGuess: !!guessSel, reportGuess,\n      discoveries, noDiscoveries: discoveries.length === 0,\n      shownScore: st.shownScore, overall, overallBand: ob,\n      ringOffset: CIRC * (1 - st.shownScore / 100),\n      ringOffsetFull: CIRC * (1 - overall / 100),\n      gateHeadline, gateSub,\n      lockedRows: cats.map((c, i) => ({ icon: c.icon, title: c.title, skel: [72, 56, 64, 80, 60][i], borderTop: i ? '1px solid var(--border)' : '0' })),\n\n      name: st.name, email: st.email, phone: st.phone, practice: st.practice, wantsCall: st.wantsCall, submitting: st.submitting,\n      onName: set('name'), onEmail: set('email'), onPhone: set('phone'),\n      onPractice: (v) => this.setState({ practice: v }),\n      onCall: (e) => this.setState({ wantsCall: e.target.checked }),\n      practiceOptions: PRACTICES, phoneRequired, phoneHint: phoneRequired ? undefined : 'Optional',\n      errName: er.name, errEmail: er.email, errPhone: er.phone,\n      hasErrName: !!er.name, hasErrEmail: !!er.email, hasErrPhone: !!er.phone,\n      submitLead: (e) => {\n        e.preventDefault();\n        const errors = {};\n        if (!st.name.trim()) errors.name = 'Enter your name';\n        if (!/^\\S+@\\S+\\.\\S+$/.test(st.email.trim())) errors.email = 'Enter a valid email';\n        if (phoneRequired && st.phone.replace(/\\D/g, '').length < 10) errors.phone = 'Enter a 10-digit phone number';\n        if (Object.keys(errors).length) { this.setState({ errors }); return; }\n        this.setState({ submitting: true, errors: {} });\n        this.to = setTimeout(() => { this.setState({ submitting: false, step: 'report' }); window.scrollTo(0, 0); }, 1200);\n      },\n\n      categories: cats,\n      priorities: [...cats].sort((a, b) => (GOAL_CAT[ans.goal] === b.key) - (GOAL_CAT[ans.goal] === a.key) || a.score - b.score).slice(0, 3).map((c, i) => ({ n: i + 1, title: c.title, short: c.short })),\n      reportMeta: `Run October 6, 2026 · Compared against ${COMPETITORS.length} firms near you` + (ans.goal ? ` · Focused on ${ans.goal.toLowerCase()}` : ''),\n      findRef: this.findRef,\n      restart: () => { this.stop(); this.setState({ step: 'start', progress: 0, url: '', shownScore: 0, answers: {}, qi: 0 }); window.scrollTo(0, 0); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
